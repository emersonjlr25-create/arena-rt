svg.ic{width:1em;height:1em;vertical-align:-.14em;fill:currentColor}

/* painéis do HUD */
.pn{position:absolute;z-index:5;background:linear-gradient(180deg,rgba(13,27,42,.88),rgba(5,9,16,.9));border:1px solid rgba(200,160,64,.5);
 clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.pn::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,var(--ouro),transparent 70%)}
.pn h2{font-family:'Cinzel',serif;font-weight:700;font-size:18px;letter-spacing:3px;white-space:nowrap;color:var(--ouro2);padding:13px 16px 9px;border-bottom:1px solid rgba(200,160,64,.25);display:flex;justify-content:space-between;align-items:center}
#rank h2 small{margin-left:8px}
.pn h2 small{font-family:'Rajdhani';font-size:14px;letter-spacing:1px;color:#9fb0c4}

/* marca */
#marca{position:absolute;left:40px;top:22px;z-index:5;display:flex;gap:16px;align-items:center}
#marca .lp{width:74px;height:74px;border-radius:50%;background:#f6f1e3;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--ouro),0 0 22px rgba(200,160,64,.55)}
#marca .lp img{width:56px}
#marca h1{font-family:'Cinzel',serif;font-weight:900;font-size:25px;letter-spacing:3px;white-space:nowrap;line-height:1;background:linear-gradient(180deg,#fff3c9,#C8A040 55%,#8a6a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000)}
#marca p{font-size:18px;letter-spacing:2px;white-space:nowrap;color:#c9d4e2;margin-top:6px;text-shadow:0 2px 3px #000}
#marca p b{color:#fff;font-size:24px;letter-spacing:1px;margin-right:8px}
#base{display:inline-flex;align-items:center;gap:6px;margin-left:8px;color:#9fb0c4}
#base i{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84}
#base.velha i{background:#ffb020;box-shadow:0 0 8px #ffb020;animation:pisca 1s infinite}
#base.velha{color:#ffcf7a}
@keyframes pisca{50%{opacity:.25}}

/* barra do chefão */
#bossbar{position:absolute;left:470px;right:470px;top:14px;z-index:5;text-align:center}
#bossbar .bn{margin-bottom:4px;line-height:1}
#bossbar .bn b{font-family:'Cinzel',serif;font-weight:900;font-size:31px;letter-spacing:8px;color:#ffe9dc;white-space:nowrap;text-shadow:0 0 18px var(--fase),0 3px 0 #000}
#fase{font-size:18px;letter-spacing:2px;color:#fff;background:var(--fase);padding:1px 14px 0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);white-space:nowrap}
#pct{position:absolute;left:0;right:0;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;text-shadow:0 2px 3px #000,0 0 8px #000;letter-spacing:2px;z-index:2}
#pct small{font-size:17px;letter-spacing:3px;margin-left:8px}
.trilho{position:relative;height:16px;background:#12080a;border:1px solid #6b4a1c;overflow:hidden}
.trilho .fan{position:absolute;left:0;top:0;bottom:0;background:#ffe2a8;transition:width 1.3s ease .5s}
.trilho .hp{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#ff6b3d,#c4001f 60%,#7a0012);transition:width .28s ease}
#tb{height:34px;border:2px solid #a17a2c;box-shadow:0 0 0 2px #1a1206,0 0 26px color-mix(in srgb,var(--fase) 55%,transparent),inset 0 0 12px #000;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
#tb .hp::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 45%),repeating-linear-gradient(90deg,transparent 0 51px,rgba(0,0,0,.28) 51px 53px)}
#tb .mk{position:absolute;top:0;bottom:0;width:3px;background:#f1d488;opacity:.75;box-shadow:0 0 6px #000}
#tb.baixo .hp{animation:alerta 1s ease-in-out infinite}
@keyframes alerta{50%{filter:brightness(1.5)}}
#bossbar .bi{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;font-size:18px;letter-spacing:1.5px;white-space:nowrap;color:#e8d9c6;text-shadow:0 2px 3px #000}
#bossbar .bi b{color:var(--ouro2);font-size:21px}
#vidaTxt{flex:1;text-align:left}

/* missão do dia */
#missao{right:40px;top:22px;width:380px;height:104px;padding:10px 16px}
#missao .l1{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;letter-spacing:3px;color:#9fb0c4}
#missao .l1 b{font-size:17px;color:#3ddc84;letter-spacing:2px;opacity:0}
#missao.ok .l1 b{opacity:1}
#missao .l2{display:flex;align-items:flex-end;justify-content:space-between;margin-top:1px}
#missao .num{font-size:46px;font-weight:700;line-height:.95;color:#fff}
#missao .num small{font-size:22px;color:#9fb0c4;letter-spacing:1px}
#missao .gan{font-size:21px;letter-spacing:2px;color:#ffe066;text-align:right;line-height:1}
#missao .gan b{font-size:40px;font-weight:700;margin-left:6px;text-shadow:0 0 14px #ffb300}
#missao .mb{height:8px;background:#0a1320;border:1px solid #2a3b52;margin-top:6px;overflow:hidden}
#missao .mb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#C8A040,#fff3c9);transition:width .6s}
#missao.ok .mb i{background:linear-gradient(90deg,#1faa5c,#7dffb0)}
.pulso{animation:pulso .5s ease-out}
@keyframes pulso{40%{transform:scale(1.3)}}

/* clientes */
#clientes{position:absolute;left:430px;right:430px;top:136px;display:flex;gap:12px;z-index:5}
.cli{flex:1 1 0;min-width:0;overflow:hidden;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(13,27,42,.86),rgba(5,9,16,.88));border:1px solid rgba(200,160,64,.4);padding:7px 9px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.cli>img{width:44px;height:44px;border-radius:6px;object-fit:contain;background:#fff;padding:3px;flex:none}

/* ---------- dados: fila de golpes, memória do que já passou na TV ---------- */
let MEM=null;
function lerVistos(dia){try{const o=JSON.parse(localStorage.getItem('arena_rt_vistos')||'null');return o&&o.dia===dia?new Set(o.ids):null;}catch(_){return MEM&&MEM.dia===dia?new Set(MEM.ids):null;}}
function gravaVistos(dia,ids){MEM={dia,ids:[...ids]};if(DEMO)return;try{localStorage.setItem('arena_rt_vistos',JSON.stringify(MEM));}catch(_){}}
let R0=null,FILA=[],vistos=new Set(),dia=null,proxAt=0,ultimo=null,logIni=false;
function lerSet(k){try{const v=localStorage.getItem(k);return v?new Set(JSON.parse(v)):null;}catch(_){return null;}}
function gravaSet(k,s){if(DEMO)return;try{localStorage.setItem(k,JSON.stringify([...s]));}catch(_){}}
/* frentes (clientes) já vistas com backlog, e frentes já comemoradas como zeradas */
let frentes=DEMO?null:lerSet('arena_rt_frentes');const zerados=(DEMO?null:lerSet('arena_rt_zerados'))||new Set();
const estCli=c=>({v:c.backlog,t:c.total,pista:c.pista,voo:c.voo,ganho:c.ganho,negado:c.negado});
const pendente=n=>FILA.some(e=>e.tipo==='reforco'&&e.cliente===n);
const visivel=c=>!pendente(c.nome)&&((frentes&&frentes.has(c.nome))||c.backlog>0);
function layout(){const n=Object.keys(V.cli).length;$('clientes').className=n>=7?'duas cmp':n>=6?'duas':n>=4?'cmp':'';$('cam').classList.toggle('duas',n>=6);}
function montaEstado(){const vis=R0.clientes.filter(visivel);montaClientes(vis);V.cli={};vis.forEach(c=>V.cli[c.nome]=estCli(c));Object.keys(C).forEach(k=>C[k].style.display=V.cli[k]?'':'none');layout();
 D.negociadores.forEach(n=>{const x=(R0.negociadores||{})[n.nome]||{a:0,g:0};V.neg[n.nome]={a:x.a,g:x.g};});
 FILA.forEach(e=>aplicaEvento(e,-1));
 let mud=false;Object.entries(V.cli).forEach(([k,c])=>{const z=c.t>0&&c.v<=0;if(z!==zerados.has(k)){z?zerados.add(k):zerados.delete(k);mud=true;}});if(mud)gravaSet('arena_rt_zerados',zerados);
 const em=$('base');em.querySelector('em').textContent='BASE '+((R0.atualizado||'').split(' ')[1]||'');em.classList.toggle('velha',baseVelha(R0.atualizado));pintar();}
function baseVelha(a){const m=/(\d+)\/(\d+) (\d+):(\d+)/.exec(a||'');if(!m)return false;const n=new Date(),d=new Date(n.getFullYear(),m[2]-1,+m[1],+m[3],+m[4]),h=n.getHours()+n.getMinutes()/60,w=n.getDay();
 return w>=1&&w<=5&&h>=9&&h<=19.5&&(n-d)>75*60000;}
function aplica(R){
 if(!R)return;const chave=R.atualizado+'|'+R.eventos.length+'|'+((R.repetir||{}).token||'');if(chave===ultimo)return;ultimo=chave;
 if(R.meta_diaria)META=R.meta_diaria;
 if(R.data!==dia){dia=R.data;FILA=[];logIni=false;$('lg').innerHTML='';const v=lerVistos(dia);
  if(v)vistos=v;else{vistos=new Set(R.eventos.map(e=>e.id));gravaVistos(dia,vistos);} }
 const naFila=new Set(FILA.map(e=>e.id));
 let novos=R.eventos.filter(e=>!vistos.has(e.id)&&!naFila.has(e.id));
 if(R.repetir&&R.repetir.token&&!DEMO){let rep=null;try{rep=localStorage.getItem('arena_rt_rep');}catch(_){}
  if(rep!==R.repetir.token){try{localStorage.setItem('arena_rt_rep',R.repetir.token);}catch(_){}
   const ids=new Set(R.repetir.ids);novos=R.eventos.filter(e=>ids.has(e.id)&&!naFila.has(e.id)).concat(novos.filter(e=>!ids.has(e.id)));}}
 /* frente nova (cliente que aparece com backlog pela primeira vez) vira reforço do chefão */
 const prim=!frentes,refs=[];if(prim)frentes=new Set();
 R.clientes.forEach(c=>{if(frentes.has(c.nome)||c.backlog<=0)return;frentes.add(c.nome);if(!prim)refs.push({id:'reforco-'+c.nome,tipo:'reforco',cliente:c.nome,n:c.backlog});});
 if(prim||refs.length)gravaSet('arena_rt_frentes',frentes);
 if(refs.length){const rs=new Set(refs.map(e=>e.cliente));novos.filter(e=>e.tipo==='cura'&&rs.has(e.cliente)).forEach(e=>vistos.add(e.id));novos=refs.concat(novos.filter(e=>!(e.tipo==='cura'&&rs.has(e.cliente))));gravaVistos(dia,vistos);}
 if(!logIni){logIni=true;R.eventos.filter(e=>vistos.has(e.id)).slice(-9).forEach(e=>addLog(e,1));}
 if(novos.length){FILA=FILA.concat(novos);if(!proxAt)proxAt=Date.now()+INICIO;}
 R0=R;if(!emTurno)montaEstado();
}
/* agrupa golpes do mesmo negociador em um combo (até 10 por turno) */
function proximoGrupo(){const e=FILA[0];if((e.tipo!=='g'&&e.tipo!=='c')||!e.nome)return[e];return FILA.filter(x=>x.nome===e.nome&&x.tipo===e.tipo).slice(0,10);}
function proximaRodada(){const n=new Date(),d=new Date(n);d.setSeconds(0,0);
 for(let i=0;i<14*48;i++){const m=d.getMinutes();d.setMinutes(m<30?30:60);const h=d.getHours()+d.getMinutes()/60,w=d.getDay();
  if(w>=1&&w<=5&&h>=8.5&&h<=19.5){const c=new Date(d.getTime()+4*60000);if(c>n)return d;}}
 return null;}
let demoN=0;
function demoEvento(){demoN++;const novo=(nome,b)=>{R0.clientes.push({nome,logo:'',backlog:b,total:b,pista:0,voo:0,ganho:0,negado:0});return[{id:'demo-ref-'+nome,tipo:'reforco',cliente:nome}];};
 if(demoN===2){const k=R0.clientes.filter(c=>V.cli[c.nome]&&V.cli[c.nome].v>0).sort((a,b)=>V.cli[a.nome].v-V.cli[b.nome].v)[0],nn=pega(D.negociadores).nome;return Array.from({length:Math.min(10,V.cli[k.nome].v)},(_,i)=>({id:'demo-z'+i,tipo:'g',nome:nn,cliente:k.nome}));}
 if(demoN===3)return novo('LÉO MADEIRAS',68);
 if(demoN===5)return novo('AVENIDA',40);
 const n=pega(D.negociadores).nome,c=pega(R0.clientes.filter(x=>V.cli[x.nome]&&V.cli[x.nome].v>0)).nome,r=Math.random(),k=r<.5?1:r<.8?3:6,t=Math.random()<.22?'c':'g',o=[];
 if(Math.random()<.1)return[{id:'demo-'+Math.random(),tipo:'cura',n:4+Math.floor(Math.random()*9),cliente:c}];
 for(let i=0;i<(t==='c'?Math.min(k,2):k);i++)o.push({id:'demo-'+Math.random(),tipo:t,nome:n,cliente:c});return o;}
async function tick(){
 if(DEMO&&R0&&!FILA.length&&!emTurno){FILA=demoEvento();proxAt=Date.now()+GAP;}
 if(!emTurno&&FILA.length&&proxAt&&Date.now()>=proxAt){
  emTurno=true;proxTxt='';$('prox').innerHTML='';const gr=proximoGrupo(),ids=new Set(gr.map(e=>e.id));
  try{await turno(gr);}catch(err){console.error(err);$('palco').classList.remove('cine','luta');$('combo').classList.remove('on');$('splash').className='';}
  FILA=FILA.filter(e=>!ids.has(e.id));if(!DEMO){ids.forEach(i=>vistos.add(i));gravaVistos(dia,vistos);}emTurno=false;
  proxAt=FILA.length?Date.now()+GAP:0;
  if(R0&&!DEMO)montaEstado();
 }
 if(!emTurno){let nt='';
  if(proxAt){const r=Math.max(0,Math.ceil((proxAt-Date.now())/1000));nt='PRÓXIMO ATAQUE EM <b>'+Math.floor(r/60)+':'+String(r%60).padStart(2,'0')+'</b>'+(FILA.length>1?' · FILA <b>'+FILA.length+'</b>':'');}
  else{const d=proximaRodada();if(d){const hoje=d.toDateString()===new Date().toDateString();
   nt='PRÓXIMA RODADA '+(hoje?'ÀS':(d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','').toUpperCase()+' ÀS'))+' <b>'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'</b>';}}
  if(nt!==proxTxt){proxTxt=nt;$('prox').innerHTML=nt;}}
}
setInterval(tick,1000);
function carregar(){const s=document.createElement('script');s.src='dados_rt.js?t='+Date.now();s.onload=()=>{try{aplica(window.DADOS_RT);}catch(e){console.error(e);}s.remove();};s.onerror=()=>s.remove();document.head.appendChild(s);}
/* a TV recarrega sozinha quando uma versão nova do painel é publicada */
let versao=null;
async function checaVersao(){if(location.protocol==='file:')return;try{const r=await fetch(location.pathname+'?v='+Date.now(),{method:'HEAD',cache:'no-store'});const t=r.headers.get('last-modified')||r.headers.get('etag');if(!r.ok||!t)return;
 if(!versao)versao=t;else if(t!==versao&&!emTurno&&!FILA.length)location.reload();}catch(_){}}
function relogio(){const n=new Date();$('hora').textContent=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('data').textContent=n.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','').toUpperCase()+' '+n.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
 if(R0)$('base').classList.toggle('velha',baseVelha(R0.atualizado));}
function escala(){$('palco').style.setProperty('--k',Math.min(innerWidth/1920,innerHeight/1080));}
escala();addEventListener('resize',escala);relogio();setInterval(relogio,15000);
R0=D.inicial;montaEstado();carregar();setInterval(carregar,3*60*1000);checaVersao();setInterval(checaVersao,10*60*1000);
</script>
